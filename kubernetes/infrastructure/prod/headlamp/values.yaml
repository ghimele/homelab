---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: kube-system
spec:
  values:
    image:
      # -- Container image registry
      registry: ghcr.io
      # -- Container image name
      repository: headlamp-k8s/headlamp
      # -- Image pull policy. One of Always, Never, IfNotPresent
      pullPolicy: IfNotPresent
      # -- Container image tag, If "" uses appVersion in Chart.yaml
      tag: "v0.46.0"
    initContainers:
      # - name: create-plugins-dir
      #   command:
      #     - /bin/sh
      #     - "-c"
      #     - |
      #       mkdir -p /home/headlamp/.config/Headlamp/plugins
      #       chown 100:101 home/headlamp/.config/Headlamp/plugins
      #   image: alpine:3.19
      #   securityContext:
      #     runAsUser: 0
      #     runAsGroup: 0
      #   volumeMounts:
      #     - mountPath: /home/headlamp/.config/Headlamp
      #       name: headlamp
      #       readOnly: false
      - name: create-kubeconfig
        command:
          - /bin/sh
          - "-c"
          - |
            set -e
            kubectl config set-cluster PROD-KHC --server=https://kubernetes.default.svc --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            kubectl config set-credentials PROD-KHC --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
            kubectl config set-context PROD-KHC --cluster=PROD-KHC --user=PROD-KHC
            if [ -n "${TAILSCALE_VPSLAB_API_FQDN}" ]; then
              kubectl config set-cluster VPS-LAB --server=https://vpslab-api.kube-system.svc.cluster.local:443 --tls-server-name="${TAILSCALE_VPSLAB_API_FQDN}"
              # Headlamp ignores contexts without a user. The Tailscale API proxy authenticates by tailnet identity and ignores this token.
              kubectl config set-credentials VPS-LAB --token=unused
              kubectl config set-context VPS-LAB --cluster=VPS-LAB --user=VPS-LAB
            else
              echo "Skipping VPS-LAB context: configure TAILSCALE_VPSLAB_API_FQDN in the cluster-secrets Secret." >&2
            fi
            kubectl config use-context PROD-KHC
        env:
          - name: KUBERNETES_SERVICE_HOST
            fieldRef:
                fieldPath: status.hostIP
          - name: KUBERNETES_SERVICE_PORT
            value: "6443"
          - name: KUBECONFIG
            value: /home/headlamp/.config/Headlamp/kubeconfigs/config
        image: alpine/kubectl:1.37.2
        securityContext:
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 100
        volumeMounts:
          - mountPath: /home/headlamp/.config/Headlamp/kubeconfigs
            name: kubeconfig
            readOnly: false

    config:
      # In-cluster mode adds a "main" context that duplicates PROD-KHC and needs an OIDC token the k3s API server does not accept.
      # Users sign in at the Traefik oidc middleware on the IngressRoute instead.
      inCluster: false
      watchPlugins: true  # Set to true to enable automatic plugin updates in main headlamp container
    podLabels:
      headlamp.vpslab-api-client: "true"
    volumeMounts:
      - mountPath: "/home/headlamp/.config/Headlamp/kubeconfigs/"
        name: kubeconfig
        readOnly: true
      - mountPath: "/home/headlamp/.config/Headlamp/"
        name: headlamp
        readOnly: false
    volumes:
      - name: kubeconfig
        emptyDir: {}
      - name: headlamp
        emptyDir: {}

    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            # renovate: datasource=github-tags depName=headlamp-k8s/headlamp-plugins versioning=semver
            version: "0.1.0"
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            # renovate: datasource=github-tags depName=headlamp-k8s/headlamp-plugins versioning=semver
            version: "0.5.0"
          - name: cnpg
            source: https://artifacthub.io/packages/headlamp/cnpg-headlamp-plugin/cnpg-headlamp-plugin
            # renovate: datasource=github-tags depName=cloudnative-pg/cnpg-headlamp-plugin versioning=semver
            version: "0.1.6"
        installOptions:
          parallel: true
          maxConcurrent: 2
      # The sidecar receives the cluster-admin service-account token, so pin what it runs.
      # renovate: datasource=npm depName=@headlamp-k8s/pluginctl
      version: "0.1.1"
      # Pinned by digest; bump the tag and digest together (docker buildx imagetools inspect node:<tag>).
      baseImage: node:26.13.1-alpine3.24@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
