---
# Values are injected by Flux postBuild substitution from cluster-secrets;
# keeps them out of the pod spec and HelmRelease values.
apiVersion: v1
kind: Secret
metadata:
  name: pocket-id-secrets
  namespace: security
type: Opaque
stringData:
  ENCRYPTION_KEY: ${POCKETID_ENCRYPTION_KEY}
  DB_CONNECTION_STRING: postgres://pocketid:${POCKETID_DB_PASSWORD}@postgres-cluster-rw.cnpg-db.svc.cluster.local:5432/pocketid
