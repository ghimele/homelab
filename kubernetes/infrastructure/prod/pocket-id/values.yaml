---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: security
spec:
  interval: 10m
  values:
    controllers:
      pocket-id:
        containers:
          app:
            env:
              APP_URL: https://${HOST_POCKETID}.${DOMAIN}
              TRUST_PROXY: "true"
              ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: pocket-id-secrets
                    key: ENCRYPTION_KEY
              DB_CONNECTION_STRING:
                valueFrom:
                  secretKeyRef:
                    name: pocket-id-secrets
                    key: DB_CONNECTION_STRING

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: pocket-id-data
        globalMounts:
          - path: /app/data

    service:
      app:
        controller: pocket-id
        annotations:
          gatus.io/monitor: "true"
          gatus.home-operations.com/endpoint: |
            group: "security"
            url: http://pocket-id.security.svc.cluster.local:1411/
            conditions:
              - "[STATUS] == 200"
              - "[RESPONSE_TIME] < 1000"
        ports:
          http:
            port: 1411
