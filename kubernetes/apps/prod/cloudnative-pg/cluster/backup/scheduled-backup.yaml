---
# Daily base backup (03:00 UTC) through the Barman Cloud plugin; WAL is archived continuously, so any point in time
# within the ObjectStore retention window can be restored. "immediate" takes the first backup right after creation.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-cluster-daily
  namespace: cnpg-db
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: postgres-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
