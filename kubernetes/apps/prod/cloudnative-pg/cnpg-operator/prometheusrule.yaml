---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-default-alerts
  namespace: monitoring
  annotations:
    prometheus-operator-validated: "true"
spec:
  groups:
    - name: cnp-default.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabaseXidAge
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
        - alert: CNPGInstanceNotReady
          annotations:
            description: A PostgreSQL instance has not been ready for 5 minutes.
            summary: PostgreSQL instance is not ready.
          expr: |-
            kube_pod_status_ready{namespace="cnpg-db", pod=~"postgres-cluster-[0-9]+", condition="false"} == 1
          for: 5m
          labels:
            severity: critical
        - alert: CNPGConnectionsHigh
          annotations:
            description: PostgreSQL connections have exceeded 80% of the configured maximum for 10 minutes.
            summary: PostgreSQL connections are nearing the limit.
          expr: |-
            sum by (namespace, pod) (cnpg_backends_total{namespace="cnpg-db", job="cnpg-db/postgres-cluster"})
              / on (namespace, pod)
            max by (namespace, pod) (cnpg_pg_settings_setting{namespace="cnpg-db", job="cnpg-db/postgres-cluster", name="max_connections"}) > 0.8
          for: 10m
          labels:
            severity: warning
        - alert: CNPGVolumeSpaceLow
          annotations:
            description: A PostgreSQL data, WAL, or tablespace volume has less than 15% available space.
            summary: PostgreSQL volume space is low.
          expr: |-
            kubelet_volume_stats_available_bytes{namespace="cnpg-db", persistentvolumeclaim=~"postgres-cluster-[0-9]+(-wal|-tbs-.+)?"}
              / kubelet_volume_stats_capacity_bytes{namespace="cnpg-db", persistentvolumeclaim=~"postgres-cluster-[0-9]+(-wal|-tbs-.+)?"} < 0.15
          for: 10m
          labels:
            severity: warning
        - alert: CNPGNoSuccessfulBackup
          annotations:
            description: CNPG reports no successful backup for postgres-cluster; external backups are not represented by this metric.
            summary: No successful CNPG-managed backup is recorded.
          expr: |-
            max(cnpg_collector_last_available_backup_timestamp{namespace="cnpg-db", job="cnpg-db/postgres-cluster"}) == 0
          for: 30m
          labels:
            namespace: cnpg-db
            severity: warning
        - alert: CNPGBackupFailed
          annotations:
            description: The most recent failed CNPG backup is newer than the most recent successful backup.
            summary: PostgreSQL backup failed.
          expr: |-
            max(cnpg_collector_last_failed_backup_timestamp{namespace="cnpg-db", job="cnpg-db/postgres-cluster"})
              > max(cnpg_collector_last_available_backup_timestamp{namespace="cnpg-db", job="cnpg-db/postgres-cluster"})
          for: 10m
          labels:
            namespace: cnpg-db
            severity: warning
