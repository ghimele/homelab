---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: cnpg-db
data:
  servers.json: |-
    {
      "Servers": {
        "1": {
          "Name": "Production PostgreSQL (primary)",
          "Group": "Homelab",
          "Host": "postgres-cluster-rw.cnpg-db.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "postgres",
          "SSLMode": "prefer",
          "Comment": "CloudNativePG production cluster primary service"
        }
      }
    }
