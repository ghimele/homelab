---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pgadmin
  namespace: cnpg-db
spec:
  entryPoints:
    - websecure
  tls:
    secretName: pgadmin.${DOMAIN}
  routes:
    - kind: Rule
      match: Host(`pgadmin.${DOMAIN}`)
      middlewares:
        - name: security-header
          namespace: traefik
      services:
        - name: pgadmin
          kind: Service
          namespace: cnpg-db
          port: 5050
