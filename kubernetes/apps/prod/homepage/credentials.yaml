---
# Values are injected by Flux postBuild substitution from cluster-secrets.
# Exposed to homepage as HOMEPAGE_VAR_* so widget credentials are referenced
# as {{HOMEPAGE_VAR_*}} in gethomepage.dev annotations instead of plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-widget-credentials
  namespace: homepage
type: Opaque
stringData:
  HOMEPAGE_VAR_GRAFANA_USERNAME: ${GRAFANA_USERNAME}
  HOMEPAGE_VAR_GRAFANA_PASSWORD: ${GRAFANA_PASSWORD}
