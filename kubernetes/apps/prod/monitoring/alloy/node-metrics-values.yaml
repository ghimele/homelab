---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-node-metrics
  namespace: monitoring
spec:
  values:
    serviceMonitor:
      enabled: true
    alloy:
      extraEnv:
        - name: CLUSTER_NAME
          value: ${CLUSTER_NAME}
        - name: PROMETHEUS_REMOTE_WRITE_URL
          value: http://prometheus-operated.monitoring.svc:9090/api/v1/write
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
