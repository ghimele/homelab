---
resources:
  - ../../../base/monitoring/alloy
  - ../../../base/monitoring/alloy/events
  - ../../../base/monitoring/alloy/node-metrics
  - syslog-service.yaml

patches:
  - path: values.yaml
    target:
      kind: HelmRelease
      name: alloy
  - path: events-values.yaml
    target:
      kind: HelmRelease
      name: alloy-events
  - path: node-metrics-values.yaml
    target:
      kind: HelmRelease
      name: alloy-node-metrics
