---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m0s
  values:
    loki:
      limits_config:
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      persistence:
        size: 15Gi
        storageClass: longhorn
