---
# jellyfin release
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  values:
    persistence:
      config:
        storageClass: longhorn
        existingClaim: jellyfin-config
      media:
        storageClass: nfs-media
        ## -- Use an existing PVC for this mount
        existingClaim: media
      cache:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi

    # -- Node selector for pod scheduling.
    nodeSelector:
      # We will install all the services on nodes labeled as storage:NFS (the agent nodes)
      node-role.kubernetes.io/nfs: ""

    # The chart's default startupProbe (tcpSocket) passes as soon as Kestrel binds 8096,
    # so liveness/readiness take over while Jellyfin is still doing its ~50s cold boot on
    # the Longhorn config volume. We can't swap the startup handler to httpGet /health
    # because Flux strips null values from HelmRelease spec.values, so the chart's tcpSocket
    # can't be removed (two handlers = invalid Deployment). Instead we give liveness a wide
    # failure window so it can't kill the pod mid-boot, and let readiness gate traffic.
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 12  # tolerate ~2 min of boot before restarting

    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    metrics:
      # -- Enable or disable metrics collection - Ensure you have started and configured your Jellyfin instance first as this will fail if system.xml does not exist yet
      enabled: false
      # -- Configuration for the Prometheus ServiceMonitor
      serviceMonitor:
        # -- Enable or disable the creation of a ServiceMonitor resource
        enabled: false

    service:
      annotations:
        # This enables discovery
        gatus.io/monitor: "true"

        # This tells Gatus *how* to monitor it
        gatus.home-operations.com/endpoint: |
          # Assign it to a group on the dashboard
          group: "media"
