---
# Values are injected by Flux postBuild substitution from cluster-secrets;
# keeps them out of the pod spec and HelmRelease values.
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-credentials
  namespace: media
type: Opaque
stringData:
  DB_URL: ${IMMICH_DB_URL}
  DB_PASSWORD: ${IMMICH_DB_PASSWORD}
