---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: media
spec:
  interval: 10m
  chart:
    spec:
      chart: immich
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system

  values:
    # These entries are shared between all the Immich components
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
            env:
              REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
              PUBLIC_IMMICH_SERVER_URL: https://${HOST_IMMICH}.${DOMAIN}
              IMMICH_TELEMETRY_INCLUDE: all
              IMMICH_LOG_FORMAT: json
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 4Gi

    immich:
      metrics:
        # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
        enabled: true
      persistence:
        # Main data store for all photos shared between different components.
        library:
          # Automatically creating the library volume is not supported by this chart
          # You have to specify an existing PVC to use
          existingClaim: photos
      configuration: {}

    # Dependencies
    valkey:
      enabled: true
      controllers:
        main:
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 500m
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: 9.2-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
                pullPolicy: IfNotPresent
      persistence:
        data:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-valkey-data
      service:
        main:
          enabled: true
          annotations:
            # This enables discovery
            gatus.io/monitor: "true"

            # This tells Gatus *how* to monitor it
            gatus.home-operations.com/endpoint: |
              # Assign it to a group on the dashboard
              group: "media"

    # Immich components
    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                pullPolicy: IfNotPresent
              # Only the server talks to Postgres; keep DB credentials off machine-learning and valkey.
              env:
                DB_URL:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-credentials
                      key: DB_URL
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-credentials
                      key: DB_PASSWORD
                DB_HOSTNAME: ${IMMICH_DB_HOSTNAME}
                DB_USERNAME: ${IMMICH_DB_USERNAME}
                DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME}
                DB_VECTOR_EXTENSION: pgvector
                IMMICH_TELEMETRY_INCLUDE: all
                IMMICH_LOG_FORMAT: json
      ingress:
        main:
          enabled: false
      defaultPodOptions:
        # Never co-locate with immich-machine-learning (performance)
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: machine-learning
                    app.kubernetes.io/instance: immich
                topologyKey: kubernetes.io/hostname
      # -- Node selector for pod scheduling.
      nodeSelector:
        # We will install all the services on nodes labeled as storage:NFS (the agent nodes)
        node-role.kubernetes.io/nfs: ""
      service:
        main:
          enabled: true
          annotations:
            # This enables discovery
            gatus.io/monitor: "true"

            # This tells Gatus *how* to monitor it
            gatus.home-operations.com/endpoint: |
              # Assign it to a group on the dashboard
              group: "media"

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
                IMMICH_TELEMETRY_INCLUDE: all
                IMMICH_LOG_FORMAT: json
      defaultPodOptions:
        # Never co-locate with immich-server (performance)
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: server
                    app.kubernetes.io/instance: immich
                topologyKey: kubernetes.io/hostname
      persistence:
        cache:
          enabled: true
          size: 10Gi
          # Optional: Set this to pvc to avoid downloading the ML models every start.
          # type: emptyDir
          accessMode: ReadWriteMany
          storageClass: longhorn
      service:
        main:
          enabled: true
          annotations:
            # This enables discovery
            gatus.io/monitor: "true"

            # This tells Gatus *how* to monitor it
            gatus.home-operations.com/endpoint: |
              # Assign it to a group on the dashboard
              group: "media"
