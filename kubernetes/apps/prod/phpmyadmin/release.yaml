---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phpmyadmin
  namespace: phpmyadmin
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      phpmyadmin:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
        containers:
          app:
            image:
              repository: docker.io/phpmyadmin
              tag: "5.2.3"
            env:
              PMA_ARBITRARY: "1"
              UPLOAD_LIMIT: "4096K"
            resources:
              requests:
                cpu: 30m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        controller: phpmyadmin
        ports:
          http:
            port: 80
