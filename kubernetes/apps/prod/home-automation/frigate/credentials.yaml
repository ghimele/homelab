---
# Values are injected by Flux postBuild substitution from cluster-secrets;
# keeps them out of the pod spec and HelmRelease values.
apiVersion: v1
kind: Secret
metadata:
  name: frigate-camera-credentials
  namespace: home-automation
type: Opaque
stringData:
  FRIGATE_CAM1_USER: ${FRIGATE_CAM1_USER}
  FRIGATE_CAM1_PASS: ${FRIGATE_CAM1_PASS}
  FRIGATE_CAM1_IP: ${FRIGATE_CAM1_IP}
