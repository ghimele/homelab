---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-events
  namespace: monitoring
spec:
  interval: 10m0s
  chart:
    spec:
      chart: alloy
      version: '1.15.0'
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    rbac:
      create: false
    controller:
      type: deployment
      replicas: 1
      updateStrategy:
        type: Recreate
    alloy:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: '1'
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      configMap:
        content: |
          loki.source.kubernetes_events "cluster" {
            job_name   = "integrations/kubernetes/eventhandler"
            log_format = "logfmt"
            forward_to = [loki.write.local.receiver]
          }

          loki.write "local" {
            endpoint {
              url = "http://loki:3100/loki/api/v1/push"
            }
          }
