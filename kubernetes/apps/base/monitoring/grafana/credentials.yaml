---
# Values are injected by Flux postBuild substitution from cluster-secrets;
# keeps them out of the HelmRelease values and the grafana.ini ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: monitoring
type: Opaque
stringData:
  admin-user: ${GRAFANA_USERNAME}
  admin-password: ${GRAFANA_PASSWORD}
  github-client-secret: ${GRAFANA_GITHUB_CLIENTSECRET}
