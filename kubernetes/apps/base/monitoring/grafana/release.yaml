---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    rbac:
      namespaced: true
    deploymentStrategy:
      type: Recreate
    fullnameOverride: grafana
    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: ${TIMEZONE}
    # Administrator credentials when not using an existing secret (see below)
    adminUser: ${GRAFANA_USERNAME}
    adminPassword: ${GRAFANA_PASSWORD}
    env:
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
      GF_EXPLORE_ENABLED: true
      GF_SECURITY_ANGULAR_SUPPORT_ENABLED: true
    grafana.ini:
      server:
        domain: ${HOST_GRAFANA}.${DOMAIN}
        root_url: https://${HOST_GRAFANA}.${DOMAIN}
        serve_from_sub_path: false
        enable_gzip: true
      auth.github:
        enabled: true
        allow_sign_up: true
        scopes: user:email,read:org
        auth_url: https://github.com/login/oauth/authorize
        token_url: https://github.com/login/oauth/access_token
        api_url: https://api.github.com/user
        client_id: ${GRAFANA_GIHUB_CLIENTID}
        client_secret: ${GRAFANA_GITHUB_CLIENTSECRET}
        allowed_domains: ghimele.com github.com outlook.com
        role_attribute_path: "[login=='${EMAIL}'][0] && 'Admin' || 'Viewer'"
        skip_org_role_sync: true
      log:
        level: warn
      users:
        allow_sign_up: false
        auto_assign_org: true
        auto_assign_org_id: 1
        auto_assign_org_role: Admin
      auth:
        disable_signout_menu: true
      auth.proxy:
        enabled: true
        header_name: Remote-User
        header_property: username
        headers: 'Name:Remote-Name Email:Remote-Email Groups:Remote-Groups'
        auto_sign_up: false
        enable_login_token: true
        sync_ttl: 60
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      news:
        news_feed_enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus-operated.monitoring.svc:9090
            jsonData:
              timeInterval: 1m
            isDefault: true
          - name: Alertmanager
            access: proxy
            jsonData:
              implementation: prometheus

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        # cloudflared:
        #   # renovate: depName="Cloudflare Tunnels (cloudflared)"
        #   gnetId: 17457
        #   revision: 6
        #   datasource:
        #     - { name: DS_PROMETHEUS, value: VictoriaMetrics }
        node-exporter-full:
          # renovate: depName="Node Exporter Full"
          gnetId: 1860
          revision: 46
          datasource: prometheus
        cloudnative-pg:
          url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/main/charts/cluster/grafana-dashboard.json
          datasource: prometheus
        cert-manager:
          # renovate: depName="Cert-manager-Kubernetes"
          gnetId: 20842
          revision: 3
          datasource: prometheus
        gatus:
          gnetId: 24379
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: prometheus
        alertmanager:
          url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/alertmanager/dashboards/alertmanager-overview.json
          datasource: prometheus
        house-health:
          json: |
            {
              "uid": "homelab-house-health",
              "title": "Home Health",
              "schemaVersion": 39,
              "version": 1,
              "editable": true,
              "tags": ["home-automation", "home-assistant"],
              "timezone": "browser",
              "refresh": "30s",
              "time": {"from": "now-3h", "to": "now"},
              "links": [
                {"title": "Service Checks", "type": "link", "url": "/d/KPI7Qj1Wk", "keepTime": true},
                {"title": "Storage", "type": "link", "url": "/d/homelab-longhorn", "keepTime": true},
                {"title": "Alerts", "type": "link", "url": "https://${HOST_ALERTS}.${DOMAIN}"}
              ],
              "panels": [
                {
                  "id": 1,
                  "title": "Home Assistant API",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
                  "targets": [{
                    "refId": "A",
                    "expr": "max(gatus_results_endpoint_success{namespace=\"monitoring\",job=\"gatus\",key=\"home-automation_home-assistant\"})",
                    "instant": true
                  }],
                  "fieldConfig": {
                    "defaults": {"noValue": "Unknown", "mappings": [{"type": "value", "options": {
                      "0": {"text": "Down", "color": "red"}, "1": {"text": "Up", "color": "green"}
                    }}]},
                    "overrides": []
                  },
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none", "colorMode": "background"}
                },
                {
                  "id": 2,
                  "title": "Available HA Replicas",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
                  "targets": [{
                    "refId": "A",
                    "expr": "max(kube_deployment_status_replicas_available{namespace=\"home-automation\",deployment=\"home-assistant\"})",
                    "instant": true
                  }],
                  "fieldConfig": {
                    "defaults": {"noValue": "Unknown", "unit": "short", "decimals": 0, "thresholds": {
                      "mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]
                    }},
                    "overrides": []
                  },
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none", "colorMode": "background"}
                },
                {
                  "id": 3,
                  "title": "API Response Time",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
                  "targets": [{
                    "refId": "A",
                    "expr": "1000 * max(gatus_results_duration_seconds{namespace=\"monitoring\",job=\"gatus\",key=\"home-automation_home-assistant\"})",
                    "instant": true
                  }],
                  "fieldConfig": {
                    "defaults": {"noValue": "Unknown", "unit": "ms", "decimals": 1, "thresholds": {
                      "mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 500}, {"color": "red", "value": 1000}]
                    }},
                    "overrides": []
                  },
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none", "colorMode": "background"}
                },
                {
                  "id": 4,
                  "title": "HA Config PVC Used",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
                  "targets": [{
                    "refId": "A",
                    "expr": "100 * max(kubelet_volume_stats_used_bytes{namespace=\"home-automation\",persistentvolumeclaim=\"home-assistant-pvc\"} / kubelet_volume_stats_capacity_bytes)",
                    "instant": true
                  }],
                  "fieldConfig": {
                    "defaults": {"noValue": "Unknown", "unit": "percent", "decimals": 1, "thresholds": {
                      "mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]
                    }},
                    "overrides": []
                  },
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none", "colorMode": "background"}
                },
                {
                  "id": 5,
                  "title": "PostgreSQL Collectors",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
                  "targets": [{
                    "refId": "A",
                    "expr": "min(up{namespace=\"cnpg-db\",pod=~\"postgres-cluster-[0-9]+\"}) * min(cnpg_collector_up{namespace=\"cnpg-db\",pod=~\"postgres-cluster-[0-9]+\"})",
                    "instant": true
                  }],
                  "fieldConfig": {
                    "defaults": {"noValue": "Unknown", "mappings": [{"type": "value", "options": {
                      "0": {"text": "Unhealthy", "color": "red"}, "1": {"text": "Healthy", "color": "green"}
                    }}]},
                    "overrides": []
                  },
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none", "colorMode": "background"}
                },
                {
                  "id": 6,
                  "title": "Critical Alerts",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
                  "targets": [{"refId": "A", "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\"}) or vector(0)", "instant": true}],
                  "fieldConfig": {
                    "defaults": {"unit": "short", "decimals": 0, "thresholds": {
                      "mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]
                    }},
                    "overrides": []
                  },
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none", "colorMode": "background"}
                },
                {
                  "id": 7,
                  "title": "Home Assistant API History",
                  "type": "state-timeline",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 0, "y": 4, "w": 12, "h": 9},
                  "targets": [{
                    "refId": "A",
                    "expr": "max(gatus_results_endpoint_success{namespace=\"monitoring\",job=\"gatus\",key=\"home-automation_home-assistant\"})",
                    "legendFormat": "Home Assistant"
                  }],
                  "fieldConfig": {
                    "defaults": {"noValue": "Unknown", "custom": {"spanNulls": false}, "mappings": [{"type": "value", "options": {
                      "0": {"text": "Down", "color": "red"}, "1": {"text": "Up", "color": "green"}
                    }}]},
                    "overrides": []
                  },
                  "options": {"mergeValues": true, "showValue": "auto", "rowHeight": 0.9, "legend": {"showLegend": false}}
                },
                {
                  "id": 8,
                  "title": "HA Restarts in the Last Hour",
                  "type": "timeseries",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 12, "y": 4, "w": 12, "h": 9},
                  "targets": [{
                    "refId": "A",
                    "expr": "max by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"home-automation\",pod=~\"home-assistant-.*\",container=\"main\"}[1h]))",
                    "legendFormat": "{{pod}}"
                  }],
                  "fieldConfig": {"defaults": {"noValue": "Unknown", "unit": "short", "min": 0, "decimals": 0}, "overrides": []},
                  "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}
                }
              ]
            }
        longhorn:
          json: |
            {
              "uid": "homelab-longhorn",
              "title": "Longhorn / Storage Health",
              "schemaVersion": 39,
              "version": 1,
              "editable": true,
              "tags": ["longhorn", "storage"],
              "timezone": "browser",
              "refresh": "30s",
              "time": {"from": "now-6h", "to": "now"},
              "panels": [
                {
                  "id": 1,
                  "title": "Volumes",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
                  "targets": [{"refId": "A", "expr": "count(max by (volume) (longhorn_volume_capacity_bytes))", "instant": true}],
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none"}
                },
                {
                  "id": 2,
                  "title": "Healthy Volumes",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
                  "targets": [{"refId": "A", "expr": "sum(max by (volume) (longhorn_volume_robustness{state=\"healthy\"}))", "instant": true}],
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "fixed", "fixedColor": "green"}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none"}
                },
                {
                  "id": 3,
                  "title": "Degraded Volumes",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
                  "targets": [{"refId": "A", "expr": "sum(max by (volume) (longhorn_volume_robustness{state=\"degraded\"}))", "instant": true}],
                  "fieldConfig": {
                    "defaults": {"unit": "short", "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}},
                    "overrides": []
                  },
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none", "colorMode": "background"}
                },
                {
                  "id": 4,
                  "title": "Faulted Volumes",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
                  "targets": [{"refId": "A", "expr": "sum(max by (volume) (longhorn_volume_robustness{state=\"faulted\"}))", "instant": true}],
                  "fieldConfig": {
                    "defaults": {"unit": "short", "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}},
                    "overrides": []
                  },
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none", "colorMode": "background"}
                },
                {
                  "id": 5,
                  "title": "Attached Volumes",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
                  "targets": [{"refId": "A", "expr": "sum(max by (volume) (longhorn_volume_state{state=\"attached\"}))", "instant": true}],
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none"}
                },
                {
                  "id": 6,
                  "title": "Volumes Without Longhorn Backup",
                  "type": "stat",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
                  "targets": [{"refId": "A", "expr": "sum(max by (volume) (longhorn_volume_last_backup_at) == bool 0)", "instant": true}],
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "graphMode": "none"}
                },
                {
                  "id": 7,
                  "title": "Volume Health",
                  "type": "table",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 0, "y": 4, "w": 12, "h": 9},
                  "targets": [{"refId": "A", "expr": "max by (volume, pvc, pvc_namespace, state) (longhorn_volume_robustness) == 1", "instant": true, "format": "table"}],
                  "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "Value": true}, "renameByName": {"volume": "Volume", "pvc": "PVC", "pvc_namespace": "Namespace", "state": "State"}}}],
                  "fieldConfig": {"defaults": {"custom": {"filterable": true}}, "overrides": []},
                  "options": {"showHeader": true, "cellHeight": "sm"}
                },
                {
                  "id": 8,
                  "title": "Disk Usage",
                  "type": "timeseries",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 12, "y": 4, "w": 12, "h": 9},
                  "targets": [{"refId": "A", "expr": "100 * max by (node, disk) (longhorn_disk_usage_bytes) / max by (node, disk) (longhorn_disk_capacity_bytes)", "legendFormat": "{{node}} / {{disk}}"}],
                  "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
                  "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}
                },
                {
                  "id": 9,
                  "title": "Volume Actual Size / Capacity",
                  "type": "timeseries",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 0, "y": 13, "w": 12, "h": 9},
                  "targets": [{
                    "refId": "A",
                    "expr": "100 * max by (volume, pvc, pvc_namespace) (longhorn_volume_actual_size_bytes) / max by (volume, pvc, pvc_namespace) (longhorn_volume_capacity_bytes)",
                    "legendFormat": "{{pvc_namespace}} / {{pvc}}"
                  }],
                  "fieldConfig": {"defaults": {"unit": "percent", "min": 0}, "overrides": []},
                  "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}
                },
                {
                  "id": 10,
                  "title": "Last Successful Longhorn Backup",
                  "type": "table",
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "gridPos": {"x": 12, "y": 13, "w": 12, "h": 9},
                  "targets": [{"refId": "A", "expr": "1000 * max by (volume, pvc, pvc_namespace) (longhorn_volume_last_backup_at)", "instant": true, "format": "table"}],
                  "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"volume": "Volume", "pvc": "PVC", "pvc_namespace": "Namespace"}}}],
                  "fieldConfig": {
                    "defaults": {"custom": {"filterable": true}},
                    "overrides": [{"matcher": {"id": "byName", "options": "Value"}, "properties": [
                      {"id": "unit", "value": "dateTimeAsIso"},
                      {"id": "mappings", "value": [{"type": "value", "options": {"0": {"text": "Never", "color": "orange"}}}]}
                    ]}]
                  },
                  "options": {"showHeader": true, "cellHeight": "sm"}
                }
              ]
            }
        # omada-exporter:
        #   url: https://raw.githubusercontent.com/charlie-haley/omada_exporter/main/dashboard.json
        #   datasource: VictoriaMetrics
        flux-cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json
          datasource: prometheus
        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json
          datasource: prometheus
        flux-logs:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/logs.json
          datasource: loki
        kubernetes-prometheus:
          # renovate: depName="Kubernetes / System / prometheus"
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-addons-prometheus.json
          token: ''
          datasource: prometheus
        kubernetes-api-server:
          # renovate: depName="Kubernetes / System / API Server"
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-api-server.json
          token: ''
          # gnetId: 15761
          # revision: 21
          datasource: prometheus
        kubernetes-coredns:
          # renovate: depName="Kubernetes / System / CoreDNS"
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-coredns.json
          token: ''
          # gnetId: 15762
          # revision: 22
          datasource: prometheus
        kubernetes-global:
          # renovate: depName="Kubernetes / Views / Global"
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
          token: ''
          datasource: prometheus
          folder: Kubernetes
        kubernetes-namespaces:
          # renovate: depName="Kubernetes / Views / Namespaces"
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
          token: ''
          # gnetId: 15758
          # revision: 46
          datasource: prometheus
        kubernetes-nodes:
          # renovate: depName="Kubernetes / Views / Nodes"
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
          token: ''
          # gnetId: 15759
          # revision: 40
          datasource: prometheus
        kubernetes-pods:
          # renovate: depName="Kubernetes / Views / Pods"
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
          token: ''
          # gNetId: 15760
          # revision: 41
          datasource: prometheus
        kubernetes-volumes:
          # renovate: depName="K8s / Storage / Volumes / Cluster"
          gnetId: 11454
          revision: 14
          datasource: prometheus
        traefik:
          # renovate: depName="Traefik"
          gnetId: 17346
          revision: 9
          datasource: prometheus
        node-feature-discovery:
          url: https://raw.githubusercontent.com/kubernetes-sigs/node-feature-discovery/master/examples/grafana-dashboard.json
          datasource: prometheus
    sidecar:
      dashboards:
        enabled: false
        searchNamespace: ALL
        label: grafana-dashboard
        folderAnnotation: grafana-folder
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        label: grafana-datasource
        labelValue: ""
        resource: configmap
    plugins:
      - grafana-piechart-panel
      # - victoriametrics-logs-datasource
    serviceMonitor:
      enabled: true
    testFramework:
      enabled: false
    assertNoLeakedSecrets: false
