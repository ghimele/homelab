---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: cnpg-db
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      pgadmin:
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 5050
            runAsGroup: 5050
            fsGroup: 5050
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/dpage/pgadmin4
              tag: "9.19"
            env:
              PGADMIN_DEFAULT_EMAIL:
                valueFrom:
                  secretKeyRef:
                    name: pgadmin
                    key: admin-email
              PGADMIN_DEFAULT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pgadmin
                    key: admin-password
              POCKET_ID_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: pgadmin
                    key: oidc-client-id
              POCKET_ID_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: pgadmin
                    key: oidc-client-secret
              PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
              PGADMIN_LISTEN_PORT: "5050"
              PGADMIN_SERVER_JSON_FILE: "/pgadmin4/servers.json"
              PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
              PGADMIN_DISABLE_POSTFIX: "true"
              PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['oauth2', 'internal']"
              PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER: "True"
              PGADMIN_CONFIG_MASTER_PASSWORD: "True"
              PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "0"
              PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
              PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "0"
              PGADMIN_CONFIG_OAUTH2_CONFIG: >-
                [{'OAUTH2_NAME': 'pocket-id',
                'OAUTH2_DISPLAY_NAME': 'Pocket ID',
                'OAUTH2_CLIENT_ID': __import__('os').environ['POCKET_ID_CLIENT_ID'],
                'OAUTH2_CLIENT_SECRET': __import__('os').environ['POCKET_ID_CLIENT_SECRET'],
                'OAUTH2_SERVER_METADATA_URL': 'https://${HOST_POCKETID}.${DOMAIN}/.well-known/openid-configuration',
                'OAUTH2_SCOPE': 'openid email profile'}]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        controller: pgadmin
        ports:
          http:
            port: 5050
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /var/lib/pgadmin
      servers:
        type: configMap
        name: pgadmin-servers
        globalMounts:
          - path: /pgadmin4/servers.json
            subPath: servers.json
            readOnly: true
